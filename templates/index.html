<!-- CURRENT DOCUMENT -->
<div id="documentCard" class="document-card hidden">

    <div class="document-card-top">

        <div class="document-file-icon">
            📄
        </div>

        <div class="document-details">

            <div id="documentName" class="document-name">
                No document
            </div>

            <div id="documentMeta" class="document-meta">
                Upload a PDF to start
            </div>

            <div id="documentReady" class="document-ready">
                ● Ready
            </div>

        </div>

        <button
            id="deleteDocumentBtn"
            class="delete-document-btn"
            type="button"
            onclick="deleteCurrentDocument()"
        >
            🗑 Delete
        </button>

    </div>

    <div class="document-note">
        One PDF is active at a time. Delete the current PDF before uploading a different document.
    </div>

</div>
